[tool.poetry]
name = "project-therion-api"
version = "0.1.0"
description = "API for calculating nutritional values for cat food"
authors = ["Alexandru Pavilcu <alexandrupavilcu@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.1"
sqlalchemy = "^2.0.32"
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
alembic = "^1.13.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
